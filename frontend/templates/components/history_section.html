<section id="historySection" class="content-section">
    <div class="section-header">
        <div class="section-heading">
            <span class="section-kicker">Audit trail</span>
            <h2>History</h2>
            <p>Review completed searches, upgrades, and other automation activity.</p>
        </div>

        <div class="history-controls">
            <div class="history-dropdown-container">
                <label class="sr-only" for="historyAppSelect">Filter history by app</label>
                <select id="historyAppSelect" class="styled-select">
                    <option value="all">All</option>
                    <option value="sonarr">Sonarr</option>
                    <option value="radarr">Radarr</option>
                    <option value="lidarr">Lidarr</option>
                    <option value="readarr">Readarr</option>
                    <option value="whisparr">Whisparr V2</option>
                    <option value="eros">Whisparr V3</option>
                    <option value="swaparr">Swaparr</option>
                </select>
            </div>

            <div class="history-search">
                <input type="text" id="historySearchInput" placeholder="Search history..." aria-label="Search history">
                <button id="historySearchButton" type="button" aria-label="Search history" title="Search history">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
            </div>

            <div class="history-page-size">
                <label for="historyPageSize">Show:</label>
                <select id="historyPageSize">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="250">250</option>
                    <option value="1000">1000</option>
                </select>
            </div>

            <button id="clearHistoryButton" class="clear-button" type="button">
                <i class="fas fa-trash-alt" aria-hidden="true"></i> Clear
            </button>
        </div>
    </div>

    <div class="history-container">
        <div class="modern-table-wrapper" hidden>
            <table class="modern-table history-table">
                <thead>
                    <tr>
                        <th>Processed Information</th>
                        <th>Operation</th>
                        <th>ID Number</th>
                        <th>Name of Instance</th>
                        <th>How Long Ago</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>

        <div id="historyEmptyState" class="empty-state-message" role="status" hidden>
            <i class="fas fa-history fa-3x" aria-hidden="true"></i>
            <p>No history found. Items will appear here when media is processed.</p>
        </div>

        <div id="historyLoading" class="loading-indicator" role="status" hidden>
            <i class="fas fa-spinner fa-spin fa-3x" aria-hidden="true"></i>
            <p>Loading history...</p>
        </div>
    </div>

    <div class="pagination-controls" hidden>
        <button id="historyPrevPage" class="pagination-button" type="button">
            <i class="fas fa-chevron-left" aria-hidden="true"></i> Previous
        </button>
        <span id="historyPageInfo">
            Page <span id="historyCurrentPage">1</span> of <span id="historyTotalPages">1</span>
        </span>
        <button id="historyNextPage" class="pagination-button" type="button">
            Next <i class="fas fa-chevron-right" aria-hidden="true"></i>
        </button>
    </div>

    <dialog id="historyDetailsDialog" class="history-details-dialog" aria-labelledby="historyDetailsTitle">
        <div class="history-details-dialog__header">
            <h3 id="historyDetailsTitle">History details</h3>
            <button id="historyDetailsClose" class="history-details-dialog__close" type="button"
                    aria-label="Close history details">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
        <pre id="historyDetailsContent" class="history-details-dialog__content"></pre>
    </dialog>
</section>
