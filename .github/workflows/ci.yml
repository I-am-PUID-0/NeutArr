name: CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install poetry && poetry install --no-root --only dev

      - name: Ruff — check
        run: poetry run ruff check .

      - name: Ruff — format
        run: poetry run ruff format --check .

  # ─────────────────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install poetry && poetry install --no-root --with dev

      - name: Unit tests
        run: poetry run python -m unittest discover -s tests

  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install poetry bandit pip-audit && poetry self add poetry-plugin-export

      - name: Bandit — Python source scan
        run: bandit -r src/ main.py -ll

      - name: Export main dependencies
        run: poetry export --without-hashes --only main -f requirements.txt -o /tmp/neutarr-requirements.txt

      - name: pip-audit — dependency vulnerabilities
        run: pip-audit -r /tmp/neutarr-requirements.txt
